databases:
  - name: lumira-db
    plan: free

services:
  - type: web
    name: lumira
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn lumira.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.15"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: lumira-db
          property: connectionString
